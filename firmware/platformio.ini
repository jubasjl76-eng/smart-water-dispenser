; PlatformIO Project Configuration
; For building ESP32 firmware

; smart-water-dispenser.cpp lives directly in this dir, not src/.
[platformio]
src_dir = .

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
build_src_filter = +<smart-water-dispenser.cpp>

; Monitor speed
monitor_speed = 115200

; Build flags
build_flags =
    -DCORE_DEBUG_LEVEL=3
    -DWIFI_TIMEOUT=30000

lib_deps =
    bblanchon/ArduinoJson@^6.21.5

; Upload speed
upload_speed = 921600

; Serial port
upload_port = /dev/cu.*

monitor_port = /dev/cu.*
